[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# /legacy altındaki JS/CSS her istekte yeniden doğrulanır — tarayıcı veya CDN'in
# eski atlas-app.js sunması (checkbox hatasının hortlama nedeni) imkânsız hale gelir.
[[headers]]
  for = "/legacy/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
